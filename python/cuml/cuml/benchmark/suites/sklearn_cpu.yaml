# Overlapping cases intentionally match the native, Dask, and accel neutral
# definitions exactly. Package identity is resolved independently per case.

version: 2
name: sklearn-cpu
implementation: scikit-learn

profiles:
  standard:
    warmups: 1
    repetitions: 3
    size_scale: 1.0
  smoke:
    warmups: 1
    repetitions: 1
    size_scale: 0.01

cases:
  - estimator: KMeans
    dataset:
      kind: blobs
      shape:
        rows: 5000000
        features: 128
    operation: fit_predict
    input_selection: [X]
    parameters:
      n_clusters: 5

  - estimator: DBSCAN
    dataset:
      kind: blobs
      shape:
        rows: 500000
        features: 128
    operation: fit_predict
    input_selection: [X]
    parameters:
      eps: 2.0
      min_samples: 5

  - estimator: SpectralClustering
    dataset:
      kind: blobs
      shape:
        rows: 750
        features: 64
    operation: fit_predict
    input_selection: [X]
    parameters:
      n_clusters: 5

  - estimator: AgglomerativeClustering
    dataset:
      kind: blobs
      shape:
        rows: 1000
        features: 64
    operation: fit_predict
    input_selection: [X]
    parameters:
      n_clusters: 5

  - estimator: EmpiricalCovariance
    dataset:
      kind: matrix
      shape:
        rows: 500000
        features: 128
    operation: fit
    input_selection: [X]
    parameters: {}

  - estimator: LedoitWolf
    dataset:
      kind: matrix
      shape:
        rows: 500000
        features: 128
    operation: fit
    input_selection: [X]
    parameters: {}

  - estimator: PCA
    dataset:
      kind: matrix
      shape:
        rows: 12000000
        features: 128
    operation: fit_transform
    input_selection: [X]
    parameters:
      n_components: 8

  - estimator: IncrementalPCA
    dataset:
      kind: matrix
      shape:
        rows: 2000000
        features: 128
    operation: fit_transform
    input_selection: [X]
    parameters:
      n_components: 8
      batch_size: 128

  - estimator: TruncatedSVD
