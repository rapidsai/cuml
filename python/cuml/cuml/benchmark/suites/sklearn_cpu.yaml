        rows: 12000000
        features: 128
    operation: fit_transform
    input_selection: [X]
    parameters:
      n_components: 8

  - estimator: GaussianRandomProjection
    dataset:
      kind: matrix
      shape:
        rows: 18000000
        features: 128
    operation: fit_transform
    input_selection: [X]
    parameters:
      n_components: 8
